spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=erp-backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE:25}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES:true}
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:false}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.continue-on-error=false
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:38}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:8080}}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://erpfrontend-kohl.vercel.app}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}

imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}
imagekit.default-folder=${IMAGEKIT_DEFAULT_FOLDER:/erp}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:}
app.auth.access-token-seconds=${APP_AUTH_ACCESS_TOKEN_SECONDS:900}
app.auth.refresh-token-days=${APP_AUTH_REFRESH_TOKEN_DAYS:14}
app.auth.secure-cookies=${APP_AUTH_SECURE_COOKIES:false}
app.auth.same-site=${APP_AUTH_SAME_SITE:Strict}
app.auth.expose-reset-token=${APP_AUTH_EXPOSE_RESET_TOKEN:false}
app.auth.rate-limit.max-buckets=${APP_AUTH_RATE_LIMIT_MAX_BUCKETS:10000}
app.auth.trusted-proxy-addresses=${APP_AUTH_TRUSTED_PROXY_ADDRESSES:}
app.auth.password-reset.webhook-url=${APP_AUTH_PASSWORD_RESET_WEBHOOK_URL:}
app.auth.password-reset.url-base=${APP_AUTH_PASSWORD_RESET_URL_BASE:http://localhost:5173/reset-password}
app.auth.password-reset.connect-timeout=${APP_AUTH_PASSWORD_RESET_CONNECT_TIMEOUT:PT3S}
app.auth.password-reset.request-timeout=${APP_AUTH_PASSWORD_RESET_REQUEST_TIMEOUT:PT8S}

app.cashfree.enabled=${CASHFREE_ENABLED:false}
app.cashfree.environment=${CASHFREE_ENVIRONMENT:sandbox}
app.cashfree.partner-api-key=${CASHFREE_PARTNER_API_KEY:}
app.cashfree.partner-base-url=${CASHFREE_PARTNER_BASE_URL:https://api-sandbox.cashfree.com/partners}
app.cashfree.payment-base-url=${CASHFREE_PAYMENT_BASE_URL:https://sandbox.cashfree.com/pg}
app.cashfree.partner-api-version=${CASHFREE_PARTNER_API_VERSION:2023-01-01}
app.cashfree.payment-api-version=${CASHFREE_PAYMENT_API_VERSION:2025-01-01}
app.cashfree.frontend-base-url=${CASHFREE_FRONTEND_BASE_URL:http://localhost:5173}
app.cashfree.merchant-site-url=${CASHFREE_MERCHANT_SITE_URL:https://erpfrontend-kohl.vercel.app}
app.cashfree.webhook-url=${CASHFREE_WEBHOOK_URL:http://localhost:8080/api/cashfree/webhook}
